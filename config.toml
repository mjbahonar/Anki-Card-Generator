# ANKI CARD GENERATOR — edit this file, then run: python main.py
# Relative paths start from the folder containing this file.
# Quick map: 01 Languages | 02 Excel | 03 Sources | 04 Card types
#            05 Audio | 06 Output/deck | 07 Appearance/Info | 08 Runtime

# SHARED ANKI MEDIA DESTINATION (audio and images)
# Local originals are always retained. Blank disables copying to Anki.
# Example: C:/Users/YourName/AppData/Roaming/Anki2/User 1/collection.media
[media]
anki_directory = ""

# Persistent dictionary results, original entry HTML and media backups.
[dictionary_cache]
enabled = true
path = "Cache/dictionaries.sqlite3"
refresh = false                # true fetches again; set back to false for reuse

# Optional personal meaning from the fifth Excel column, first on card backs.
[meaning]
enabled = true                 # false hides personal meanings for every card type
html = false                   # true reads Meaning cells as HTML (tables, links, <br>); Excel formatting is then ignored

# ======================================================================
# 01. LANGUAGES
# ======================================================================
# Vocabulary: Norwegian input -> English dictionary meanings.
[language]
source = "no"                  # no = Norwegian; en = English; fa = Persian
translation_target = "en"      # Used by translation sources when enabled

# Exercises: English prompts -> Norwegian (Bokmål) answers.
# This pair is independent of the vocabulary dictionary direction above.
[practice]
question_language = "en"
answer_language = "nb"         # nb = Bokmål; nn = Nynorsk; en = English; fa = Persian
model_id_base = 1559328500       # Keep fixed after the first exercise import
# Optional custom display names: [practice.language_names]
# xx = "Language name"

# ======================================================================
# 02. EXCEL INPUT
# ======================================================================
# Five adjacent columns: Input | Type | Tags | Answer | Meaning
# Meaning is optional; shown first on the back with Excel text formatting.
# Blank/missing Type = normal. Tags/Answer are optional for normal cards.
# Without a header: header = false, word_column = 0.
# With a header: header = true, word_column = 0 (or the first header name).
[input]
file = "Input.xlsx"         # Your workbook; example template is supplied separately
sheet = 0                      # First worksheet, or its name
header = true                 # Set true ONLY when row 1 contains column names
word_column = 0                # First input column; zero-based index
deduplicate = true
order = "excel"                # excel = worksheet order; random = shuffle on each run
max_words = 0                  # 0 = all valid records

# ======================================================================
# 03. DICTIONARY SOURCES
# ======================================================================
# Only Lexin is enabled. Other dictionaries, translation and images are off.
# Dictionary sources are used for normal vocabulary cards only.
[sources.lexin]
enabled = true
variant = "bokmal"             # bokmal, nynorsk or both
table_audio = true             # Inflection-table pronunciation only; click to play
entries = 2                    # First N Lexin results checked; exact headword matches only

# Additional sources: set enabled = true to use one; sections define display order.
[sources.bokmalsordboka]
enabled = false                # Bokmål definitions and inflection

[sources.nynorskordboka]
enabled = false                # Nynorsk definitions and inflection

[sources.google_translate]
enabled = false                # Uses language.source and translation_target

[sources.dict_com]
enabled = false                # Norwegian <-> English

[sources.fastdic]
enabled = false               # English -> Persian
examples_per_definition = 3

[sources.faraazin]
enabled = false               # English -> Persian

[sources.b_amooz]
enabled = false               # English -> Persian

[sources.dictionary_com]
enabled = false               # English definitions

[sources.thesaurus]
enabled = false               # English synonyms/antonyms

[sources.google_dictionary]
enabled = false               # English; Google's dictionary result

[sources.cambridge]
enabled = false               # English definitions
examples_per_definition = 3

[sources.images]
enabled = false               # Vocabulary images, with provider fallback
count = 2
priority = ["google", "commons"] # Use ["commons"] to skip Google

[sources.oxford]
enabled = false                # English definitions; audio still uses [audio.word]
examples_per_definition = 3

# ======================================================================
# 04. CARD TYPES
# ======================================================================
# Valid Excel Type values: normal (or blank), type, sentence, gap, listen.
# Every card receives its type's tag automatically; Excel tags are additional.
# Instructions are English. {answer_language} inserts the configured language name.
# Supported placeholders: {question_language}, {answer_language}
# audio switches apply together with [audio].enabled.

[cards.normal]                 # Dictionary headword; Answer may be blank
title = ""                    # Blank keeps the original front appearance
instruction = ""
tag = "normal"
audio = true

[cards.type]                   # Meaning/prompt -> typed answer; Answer REQUIRED
title = "Spelling practice"
instruction = "Write the equivalent in {answer_language}."
tag = "type"
audio = true                   # Pronunciation on the back only

[cards.sentence]               # Prompt sentence -> spoken translation; Answer REQUIRED
title = "Speaking practice"
instruction = "Say this sentence in {answer_language}."
tag = "sentence"
audio = true                   # Sample answer on the back

[cards.gap]                    # Input contains […] or [...]; Answer REQUIRED
# Multiple blanks stay on one card. Write one answer per line, in blank order.
# A count mismatch or empty answer line skips the row with a report.
title = "Fill in the blank"
instruction = "Complete the sentence in {answer_language}."
tag = "gap"
audio = false                   # Completed sentence on the back

[cards.listen]                 # Norwegian sentence in Input; English meaning optional
title = "Listening practice"
instruction = "Listen and repeat in {answer_language}."
tag = "listen"
audio = true                   # Front audio; no audio -> skip this card

# ======================================================================
# 05. AUDIO
# ======================================================================
# Normal cards: headword audio from [audio.word] for language.source.
# Providers: lexin (Norwegian), fastdic (English), google_tts (any language).
# The first provider that succeeds is used. [] disables headword audio.
# cards.normal.audio = false also turns headword audio off.
# Exercise cards: gTTS in practice.answer_language.
# nb/nn use generic Norwegian no for gTTS; no dedicated Nynorsk voice.
# Automatic playback is controlled by Anki's review preferences.
[audio]
enabled = true
priority = ["google_tts"]       # Languages not listed in [audio.word]
directory = "Audio"
cache = true
english_accent = "us"          # Fastdic accent: us or uk

[audio.word]                   # Headword audio source per input language
no = ["lexin", "google_tts"]   # Also used for nb and nn
en = ["fastdic", "google_tts"] # Example: ["google_tts"] or [] to disable
fa = ["google_tts"]

# ======================================================================
# 06. OUTPUT AND ANKI DECK
# ======================================================================
[output]
directory = "Output"
formats = ["xlsx", "csv", "apkg", "html", "json"]
filename_prefix = "words"      # Name: <input file>_<prefix>_<date-time>
autosave_every = 5              # Recovery CSV after every 5 records; 0 disables

[anki]
deck_name = "My Vocabulary"
deck_id = 2059400451            # Keep fixed after the first import
model_id = 1559328451           # Existing vocabulary model; do not change
# For a separate deck, use a separate deck_id and deck_name.

# ======================================================================
# 07. APPEARANCE AND INFO
# ======================================================================
[style]
file = "Styles/cards.css"

# English Info appears last on every card's back.
[info]
enabled = true
title = "About this deck"
text = "Created with Anki Card Generator. Build your own vocabulary deck from a simple word list."
link_text = "Create your own deck"
url = "https://github.com/mjbahonar/Anki-Card-Generator"

# ======================================================================
# 08. RUNTIME
# ======================================================================
[runtime]
timeout_seconds = 30
source_timeout_seconds = 30     # Total budget per source; 0 disables
translation_attempts = 2        # Used only if a translation source is enabled
retry_delay_seconds = 4
word_delay_seconds = 0.5
keep_awake = true
headless = true
